// Types the Compose compiler cannot judge for itself, declared stable here.
//
// :core:model is pure Kotlin and is not compiled with the Compose plugin, so the compiler has no
// stability information for anything in it and has to assume the worst. That assumption cascades:
// an unstable Workflow or RunSummary makes every wrapper holding one unstable too, so under strong
// skipping each row is compared by *instance* against an object the ViewModel just reallocated —
// and a ViewModel emits a fresh list every time anything upstream moves.
//
// Measured when this file was added, on a Home screen that has since been replaced: every workflow
// tile and every history row recomposed on every keystroke in the search box and on every completed
// run. The screen is gone; the cascade is not. It now guards the Library list, Activity's history
// rows and Home's recent runs, all of which draw :core:model types straight from a StateFlow.
//
// The declaration is true, not a convenience: everything in :core:model is a data class of
// primitives, Strings and enums, with `val` properties and no Android imports. If that ever stops
// being true, this file is the thing that has to change first.
com.arcx.core.model.*

// Immutable value types from the platform that Compose ships no stability information for.
java.time.*
